<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Buttons, Functions, and More</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="content">
            <header>
                <h1>Assignment 7</h1>
                <h2>Introduction to JavaScript</h2>
            </header>
            <main>
                <section id="speech" class="column">
                    <h3>Speech</h3>
                    <div id="speech-bubble">Hi</div>
                </section>
                <section id="beverage" class="column">
                    <h3>Beverage</h3>
                    <label for="drink">Pick your morning beverage:</label>
                    <select id="drink">
                        <option>Coffee</option>
                        <option>Orange Juice</option>
                        <option>Water</option>
                    </select>
                    <p id="drink-message"></p>
                </section>
                <section id="sticker" class="column">
                    <h3>Add a Sticker</h3>
                    <img id="sun" src="images/sun.jpg" alt="Sun">
                    <span id="emoji">😊</span>
                </section>
            </main>
            <footer>
                @Mi'Kayla Brown
            </footer>
        </div>
        <script src="script.js"></script>
    </body>
</html>
